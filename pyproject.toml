[project]
name = "job-seeker"
version = "0.1.0"
description = "Nightly job hunt automation pipeline: ingest, score, digest, cover letters."
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.27",
    "pydantic>=2.7",
    "python-dotenv>=1.0",
    "pyyaml>=6.0",
    "jinja2>=3.1",
    "click>=8.1",
    "anthropic>=1.0",
    "python-jobspy>=1.1.75",
    "pypdf>=4.0",
    "python-docx>=1.1",
    "pyperclip>=1.11.0",
    "flask>=3.1.3",
]

[project.scripts]
jobs = "jobs.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/jobs"]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-httpx>=0.30",
    "ruff>=0.6",
    "mypy>=1.10",
    "types-pyyaml>=6.0",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
warn_unused_ignores = true
check_untyped_defs = true

[tool.pytest.ini_options]
markers = [
    "network: hits a real live endpoint, skipped by default (use --run-network)",
]
testpaths = ["tests"]
