<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{% block title %}Job Seeker{% endblock %}</title>
<style>
  :root {
    --bg: #f6f7f9; --surface: #ffffff; --text: #1b1f24; --muted: #5f6b7a;
    --border: #dfe3e8; --accent: #2457d6; --accent-text: #ffffff;
    --ok-bg: #e7f6ec; --ok-text: #135c2e; --err-bg: #fdecec; --err-text: #8a1c1c;
    --hi: #1f8a4c; --mid: #b7791f; --lo: #8b95a1;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #121417; --surface: #1b1e23; --text: #e6e9ed; --muted: #9aa4b1;
      --border: #2d323a; --accent: #6c95ff; --accent-text: #0d1117;
      --ok-bg: #12301f; --ok-text: #8fe0ad; --err-bg: #3a1717; --err-text: #f3a5a5;
      --hi: #4cc382; --mid: #e0a84a; --lo: #6b7480;
    }
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text);
         font: 15px/1.5 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
  a { color: var(--accent); text-decoration: none; }
  a:hover { text-decoration: underline; }
  header { background: var(--surface); border-bottom: 1px solid var(--border); }
  .bar { max-width: 1100px; margin: 0 auto; padding: 12px 16px; display: flex; align-items: center; gap: 20px; }
  .brand { font-weight: 700; color: var(--text); }
  nav a { margin-right: 14px; color: var(--muted); font-weight: 500; }
  nav a.active { color: var(--text); }
  main { max-width: 1100px; margin: 0 auto; padding: 20px 16px 60px; }
  .card { background: var(--surface); border: 1px solid var(--border); border-radius: 10px; padding: 18px; margin-bottom: 16px; }
  .flash { padding: 10px 14px; border-radius: 8px; margin-bottom: 14px; }
  .flash.ok { background: var(--ok-bg); color: var(--ok-text); }
  .flash.error { background: var(--err-bg); color: var(--err-text); }
  .muted { color: var(--muted); }
  .small { font-size: 13px; }
  button, .btn { font: inherit; border: 1px solid var(--border); background: var(--surface); color: var(--text);
                 padding: 7px 14px; border-radius: 8px; cursor: pointer; display: inline-block; }
  button:hover, .btn:hover { border-color: var(--muted); text-decoration: none; }
  button.primary, .btn.primary { background: var(--accent); color: var(--accent-text); border-color: var(--accent); }
  button:disabled { opacity: .6; cursor: wait; }
  input, select, textarea { font: inherit; color: var(--text); background: var(--bg); border: 1px solid var(--border);
                            border-radius: 8px; padding: 7px 10px; }
  textarea { width: 100%; min-height: 160px; resize: vertical; }
  label { display: block; font-weight: 600; margin: 12px 0 4px; }
  .row { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; }
  .grow { flex: 1; min-width: 180px; }
  table { width: 100%; border-collapse: collapse; }
  th, td { text-align: left; padding: 9px 8px; border-bottom: 1px solid var(--border); vertical-align: top; }
  th { font-size: 13px; color: var(--muted); font-weight: 600; }
  tr:hover td { background: color-mix(in srgb, var(--bg) 60%, transparent); }
  .score { display: inline-block; min-width: 30px; text-align: center; padding: 1px 6px; border-radius: 6px;
           font-weight: 700; font-size: 13px; color: #fff; background: var(--lo); }
  .score.hi { background: var(--hi); } .score.mid { background: var(--mid); }
  .score.none { background: transparent; color: var(--muted); border: 1px dashed var(--border); }
  .tag { font-size: 12px; color: var(--muted); border: 1px solid var(--border); border-radius: 999px; padding: 0 8px; }
  .letter p { margin: 0 0 12px; white-space: pre-line; }
  pre.jd { white-space: pre-wrap; font: inherit; margin: 0; max-height: 480px; overflow: auto; }
  .tablewrap { overflow-x: auto; }
  @media (max-width: 700px) { .hide-sm { display: none; } }
</style>
</head>
<body>
<header><div class="bar">
  <a class="brand" href="{{ url_for('jobs_list') }}">Job Seeker</a>
  <nav>
    <a href="{{ url_for('jobs_list') }}" class="{{ 'active' if request.endpoint == 'jobs_list' }}">Jobs</a>
    <a href="{{ url_for('add') }}" class="{{ 'active' if request.endpoint == 'add' }}">Add a job</a>
  </nav>
</div></header>
<main>
  {% for category, message in get_flashed_messages(with_categories=true) %}
    <div class="flash {{ category }}">{{ message }}</div>
  {% endfor %}
  {% block content %}{% endblock %}
</main>
<script>
  // Long-running actions (LLM calls, ingest): stop double-submits and say how long to wait.
  document.querySelectorAll("form[data-busy]").forEach(function (form) {
    form.addEventListener("submit", function () {
      var btn = form.querySelector("button[type=submit]");
      if (btn) { btn.disabled = true; btn.textContent = form.dataset.busy; }
    });
  });
</script>
{% block scripts %}{% endblock %}
</body>
</html>
